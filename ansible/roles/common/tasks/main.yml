---
- name: Update all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
    exclude: curl

- name: Install basic packages needed on every server
  ansible.builtin.dnf:
    name:
      - git
      - unzip
      - htop
    state: present

- name: Create app directory
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC