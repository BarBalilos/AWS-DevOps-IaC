<svg viewBox="0 0 1300 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a5cf0"/>
    </marker>
  </defs>

  <rect width="1300" height="900" fill="#f7f8fa"/>

  <!-- Title -->
  <text x="30" y="35" font-size="22" font-weight="bold" fill="#1a1a2e">AWS DevOps Rolling Project — Terraform + Ansible Architecture</text>

  <!-- Legend -->
  <g transform="translate(880,20)">
    <rect x="0" y="0" width="16" height="16" fill="#ff9900" opacity="0.25" stroke="#ff9900"/>
    <text x="22" y="13" font-size="13" fill="#333">Created by Terraform</text>
    <rect x="0" y="24" width="16" height="16" fill="#7a5cf0" opacity="0.2" stroke="#7a5cf0"/>
    <text x="22" y="37" font-size="13" fill="#333">Configured by Ansible</text>
    <line x1="0" y1="52" x2="24" y2="52" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="30" y="56" font-size="13" fill="#333">Network traffic</text>
    <line x1="0" y1="72" x2="24" y2="72" stroke="#7a5cf0" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
    <text x="30" y="76" font-size="13" fill="#333">AWS API call (via IAM role)</text>
  </g>

  <!-- Internet -->
  <circle cx="650" cy="90" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="650" y="95" font-size="13" text-anchor="middle" fill="#1e3a8a">Internet</text>

  <!-- AWS Cloud boundary -->
  <rect x="40" y="140" width="1220" height="720" rx="10" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="55" y="165" font-size="13" fill="#666">AWS Cloud (us-east-1)</text>

  <!-- VPC boundary -->
  <rect x="70" y="180" width="820" height="620" rx="8" fill="#fff7e6" stroke="#ff9900" stroke-width="2"/>
  <text x="85" y="205" font-size="14" font-weight="bold" fill="#996600">VPC 10.0.0.0/16</text>

  <!-- IGW -->
  <rect x="430" y="215" width="140" height="40" rx="6" fill="#ff9900" opacity="0.25" stroke="#ff9900"/>
  <text x="500" y="240" font-size="12" text-anchor="middle" fill="#663d00">Internet Gateway</text>

  <!-- Public subnet -->
  <rect x="110" y="290" width="740" height="150" rx="6" fill="#ffe9cc" stroke="#ff9900" stroke-width="1.5"/>
  <text x="125" y="312" font-size="12" font-weight="bold" fill="#996600">Public Subnet 10.0.1.0/24</text>

  <!-- Frontend instance -->
  <rect x="380" y="325" width="200" height="95" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="480" y="345" font-size="13" font-weight="bold" text-anchor="middle">frontend (EC2)</text>
  <text x="480" y="362" font-size="11" text-anchor="middle" fill="#555">nginx :80</text>
  <text x="480" y="377" font-size="11" text-anchor="middle" fill="#7a5cf0">+ NAT (iptables)</text>
  <text x="480" y="392" font-size="10" text-anchor="middle" fill="#888">public IP · SG: frontend-sg</text>
  <rect x="380" y="325" width="200" height="95" rx="6" fill="#7a5cf0" opacity="0.08"/>

  <!-- Private subnets -->
  <rect x="110" y="470" width="360" height="300" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="125" y="492" font-size="12" font-weight="bold" fill="#3730a3">Private Subnet A 10.0.2.0/24</text>

  <rect x="490" y="470" width="360" height="300" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="505" y="492" font-size="12" font-weight="bold" fill="#3730a3">Private Subnet B 10.0.3.0/24</text>

  <!-- Backend instance -->
  <rect x="185" y="520" width="200" height="95" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="285" y="540" font-size="13" font-weight="bold" text-anchor="middle">backend (EC2)</text>
  <text x="285" y="557" font-size="11" text-anchor="middle" fill="#555">Flask :5000 /api/*</text>
  <text x="285" y="572" font-size="10" text-anchor="middle" fill="#888">SG: backend-sg</text>
  <rect x="185" y="520" width="200" height="95" rx="6" fill="#7a5cf0" opacity="0.08"/>

  <!-- Worker instance -->
  <rect x="565" y="520" width="200" height="95" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="665" y="540" font-size="13" font-weight="bold" text-anchor="middle">worker (EC2)</text>
  <text x="665" y="557" font-size="11" text-anchor="middle" fill="#555">Flask :5001 /upload</text>
  <text x="665" y="572" font-size="10" text-anchor="middle" fill="#888">SG: worker-sg</text>
  <rect x="565" y="520" width="200" height="95" rx="6" fill="#7a5cf0" opacity="0.08"/>

  <!-- RDS -->
  <rect x="185" y="660" width="200" height="80" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="285" y="685" font-size="13" font-weight="bold" text-anchor="middle">RDS PostgreSQL</text>
  <text x="285" y="702" font-size="10" text-anchor="middle" fill="#888">:5432 · SG: rds-sg</text>
  <rect x="185" y="660" width="200" height="80" rx="6" fill="#ff9900" opacity="0.15"/>

  <!-- S3 (outside VPC, AWS-managed service) -->
  <rect x="960" y="330" width="180" height="80" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1050" y="355" font-size="13" font-weight="bold" text-anchor="middle">S3 Bucket</text>
  <text x="1050" y="372" font-size="10" text-anchor="middle" fill="#888">private, versioned</text>
  <rect x="960" y="330" width="180" height="80" rx="6" fill="#ff9900" opacity="0.15"/>

  <!-- SNS -->
  <rect x="960" y="440" width="180" height="80" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1050" y="465" font-size="13" font-weight="bold" text-anchor="middle">SNS Topic</text>
  <text x="1050" y="482" font-size="10" text-anchor="middle" fill="#888">email subscription</text>
  <rect x="960" y="440" width="180" height="80" rx="6" fill="#ff9900" opacity="0.15"/>

  <!-- IAM role note -->
  <rect x="940" y="560" width="220" height="60" rx="6" fill="#f3e8ff" stroke="#7a5cf0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1050" y="583" font-size="11" font-weight="bold" text-anchor="middle" fill="#4c1d95">IAM instance profile</text>
  <text x="1050" y="600" font-size="10" text-anchor="middle" fill="#666">attached to all 3 EC2s</text>

  <!-- Arrows -->
  <!-- Internet -> IGW -->
  <line x1="650" y1="118" x2="530" y2="215" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- IGW -> frontend -->
  <line x1="500" y1="255" x2="490" y2="325" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="280" font-size="10" fill="#555">HTTP :80</text>

  <!-- frontend -> backend -->
  <path d="M 420 420 C 350 460, 300 480, 285 520" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="470" font-size="10" fill="#555">/api/ → :5000</text>

  <!-- frontend -> worker -->
  <path d="M 540 420 C 600 460, 640 480, 660 520" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="470" font-size="10" fill="#555">/upload → :5001</text>

  <!-- backend -> RDS -->
  <line x1="285" y1="615" x2="285" y2="660" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="295" y="640" font-size="10" fill="#555">:5432</text>

  <!-- backend/worker -> frontend (NAT return path) -->
  <path d="M 385 560 C 420 500, 420 460, 420 420" fill="none" stroke="#7a5cf0" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <path d="M 565 560 C 530 500, 530 460, 530 420" fill="none" stroke="#7a5cf0" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <text x="395" y="470" font-size="9" fill="#7a5cf0">outbound via NAT</text>

  <!-- worker -> S3 -->
  <path d="M 765 545 C 870 500, 920 420, 960 370" fill="none" stroke="#7a5cf0" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <text x="800" y="470" font-size="10" fill="#7a5cf0">PutObject</text>

  <!-- worker -> SNS -->
  <path d="M 765 570 C 870 540, 900 500, 960 480" fill="none" stroke="#7a5cf0" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <text x="800" y="555" font-size="10" fill="#7a5cf0">Publish</text>

  <!-- SNS -> email -->
  <circle cx="1230" cy="480" r="26" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="1230" y="484" font-size="11" text-anchor="middle" fill="#713f12">Email</text>
  <line x1="1140" y1="480" x2="1200" y2="480" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer notes -->
  <text x="55" y="835" font-size="11" fill="#666">Terraform provisions: VPC, subnets, route tables, security groups, EC2 instances, IAM role/profile, RDS, S3, SNS.</text>
  <text x="55" y="855" font-size="11" fill="#666">Ansible configures: NAT on frontend, package updates, nginx reverse proxy, backend/worker app deployment (systemd services).</text>
  <text x="55" y="875" font-size="11" fill="#666">No NAT Gateway used — frontend instance itself performs NAT (IP forwarding + iptables MASQUERADE) for the private subnets, to avoid extra AWS cost.</text>
</svg>
